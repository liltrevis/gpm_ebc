name: Build iOS (IPA non signe)

# Produit une archive .ipa NON SIGNEE de GPM-2EBC depuis un runner macOS.
# On peut ensuite l'installer sur un iPhone depuis Windows via Sideloadly
# (compte Apple gratuit ou payant) : voir la procedure d'installation.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Dependances
        run: flutter pub get

      - name: Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      - name: Empaqueter l'IPA non signee
        run: |
          set -e
          rm -rf Payload gpm_ebc_unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry gpm_ebc_unsigned.ipa Payload
          rm -rf Payload
          ls -lh gpm_ebc_unsigned.ipa

      - name: Sauvegarder l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: gpm_ebc-unsigned-ipa
          path: gpm_ebc_unsigned.ipa
          if-no-files-found: error
